name: Smoke

# After every successful production deployment on Vercel, and every 30 minutes as a simple uptime check.
# A failed run sends the repository owner an e-mail from GitHub.
on:
  # Vercel reports deployments as a commit status named "Vercel", not as GitHub Deployments.
  status:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Only finished deployments of main are production; preview deployments sit behind Vercel Authentication.
    if: >-
      github.event_name != 'status' ||
      (github.event.context == 'Vercel' && github.event.state == 'success' &&
       contains(github.event.branches.*.name, 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Smoke test of production
        env:
          # The production address from the repository variable SITE_URL, the demo until the client's domain is attached.
          TARGET_URL: ${{ vars.SITE_URL || 'https://hydrodemosite.vercel.app' }}
        run: node scripts/smoke.mjs "$TARGET_URL"
