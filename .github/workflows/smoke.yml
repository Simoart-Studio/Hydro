name: Smoke

# After every successful production deployment on Cloudflare Pages, and every 30 minutes as a simple uptime check.
# A failed run sends the repository owner an e-mail from GitHub.
on:
  # Cloudflare Pages reports each deployment as a check run named "Cloudflare Pages".
  check_run:
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    # Only finished deployments of main are production; other branches get preview deployments.
    if: >-
      github.event_name != 'check_run' ||
      (github.event.check_run.name == 'Cloudflare Pages' &&
       github.event.check_run.conclusion == 'success' &&
       github.event.check_run.check_suite.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
      - name: Smoke test of production
        env:
          # The production address from the repository variable SITE_URL, the client's domain by default.
          TARGET_URL: ${{ vars.SITE_URL || 'https://hydrokotly.pl' }}
        run: node scripts/smoke.mjs "$TARGET_URL"
